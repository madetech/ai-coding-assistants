<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Made Tech — AI Coding Assistants">
  <defs>
    <!-- Approximate Made Tech brand colours — pending verification with Marketing -->
    <!-- Primary red:  #E84141  |  Dark bg: #1A1A2E  |  Accent: #FF6B6B  -->

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    <!-- Diagonal stripe accent -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E84141;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1"/>
    </linearGradient>

    <!-- Background gradient: dark navy left, slightly lighter right -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#12122A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E1E3F;stop-opacity:1"/>
    </linearGradient>

    <!-- Node glow filter for accent dots -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="200" fill="url(#grid)"/>

  <!-- Left red accent bar -->
  <rect x="0" y="0" width="6" height="200" fill="url(#redGrad)"/>

  <!-- Decorative: geometric node cluster (top-right) -->
  <!-- Outer ring nodes -->
  <circle cx="1120" cy="48" r="2.5" fill="#E84141" opacity="0.7" filter="url(#glow)"/>
  <circle cx="1150" cy="72" r="2"   fill="#E84141" opacity="0.5"/>
  <circle cx="1100" cy="90" r="2"   fill="#ffffff" opacity="0.2"/>
  <circle cx="1140" cy="110" r="3"  fill="#E84141" opacity="0.6" filter="url(#glow)"/>
  <circle cx="1165" cy="55" r="1.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="1080" cy="65" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="1170" cy="130" r="2"  fill="#E84141" opacity="0.4"/>
  <circle cx="1110" cy="145" r="2.5" fill="#ffffff" opacity="0.12"/>
  <!-- Connecting lines between nodes -->
  <line x1="1120" y1="48"  x2="1150" y2="72"  stroke="#E84141" stroke-width="0.7" opacity="0.4"/>
  <line x1="1150" y1="72"  x2="1140" y2="110" stroke="#E84141" stroke-width="0.7" opacity="0.35"/>
  <line x1="1120" y1="48"  x2="1100" y2="90"  stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
  <line x1="1140" y1="110" x2="1170" y2="130" stroke="#E84141" stroke-width="0.5" opacity="0.3"/>
  <line x1="1165" y1="55"  x2="1150" y2="72"  stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

  <!-- Red underline accent bar under title -->
  <rect x="42" y="130" width="200" height="3" fill="url(#redGrad)" rx="1.5"/>

  <!-- "made tech" wordmark (top-left, small) -->
  <text
    x="42" y="62"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="3"
    fill="#E84141"
    text-anchor="start"
  >MADE TECH</text>

  <!-- Main title -->
  <text
    x="42" y="118"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="52"
    font-weight="700"
    fill="#ffffff"
    text-anchor="start"
    letter-spacing="-0.5"
  >AI Coding Assistants</text>

  <!-- Subtitle / strapline -->
  <text
    x="42" y="160"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="15"
    font-weight="400"
    fill="#ffffff"
    opacity="0.55"
    text-anchor="start"
    letter-spacing="0.3"
  >Guidance on using AI tools for technology teams at Made Tech</text>

  <!-- Brand colour notice comment: remove once verified with Marketing -->
  <!-- BRAND-REVIEW: primary red #E84141, bg #12122A — confirm with Made Tech brand kit -->
</svg>
